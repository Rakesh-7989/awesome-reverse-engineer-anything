name: Validate list

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - 'scripts/validate_list.py'
      - '.github/workflows/validate-list.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'scripts/validate_list.py'
      - '.github/workflows/validate-list.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d869806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Check tags, licenses, parity, anchors and mirrors
        run: python3 scripts/validate_list.py
